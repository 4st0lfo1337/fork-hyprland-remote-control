        .title::before {

        .title::after {
            content: "]";

        .title i {
            color: var(--red);

        .title .cursor-blink {

        @keyframes blink {
            0%, 45% { opacity: 1; }

        /* =========================================================

        .workspace-grid {

        .workspace-btn {

        .workspace-btn::before {

            font-size: 0.5rem;
            letter-spacing: 0.2em;
            opacity: 0.7;
        }

        .workspace-btn:hover {
            background: #0e0a0b;
            border-color: var(--red-dark);
            color: var(--red);

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.45),
                inset 0 0 20px rgba(206, 118, 136, 0.025);

            background: var(--red);

        .workspace-btn.bg-blue-700 {

        <!-- WORKSPACES -->
        <div class="workspace-grid">
            {% for i in range(1, 11) %}
                <button
                    id="workspace-{{ i }}"
                    class="workspace-btn"
                    onclick="switchWorkspace({{ i }})"
                >
                    <span class="num">{{ i }}</span>
                    <span class="label">WS</span>
                </button>
            {% endfor %}
        </div>

        <!-- CONTROLE DE VOLUME -->
        <div class="volume-controls">
            <button id="vol-down" class="volume-btn" onclick="adjustVolume('down')">
                <i class="fas fa-volume-down"></i>
            </button>
            <span id="volume-display">--%</span>
            <button id="vol-up" class="volume-btn" onclick="adjustVolume('up')">
                <i class="fas fa-volume-up"></i>
            </button>
            <button id="vol-mute" class="volume-btn" onclick="toggleMute()">
                <i class="fas fa-volume-mute"></i>
            </button>
        </div>

        <!-- SCREENSHOT -->
        <div class="mt-12 flex justify-center">
            <button
                id="screenshot-button"
                onclick="window.location.href='/screenshot/take'"
            >
                <i class="fas fa-camera"></i>
                SCREENSHOT
            </button>
        </div>

        <!-- RESULTADO -->
        <div id="screenshot-result"></div>
    </div>

    <script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
