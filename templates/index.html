<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Hyprland Remote control</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
{# Design an UI which displays 1-10 boxes of buttons to switch workspaces#}
<div class="flex flex-col flex-wrap justify-center items-center h-screen bg-gray-100">
    <div class="grid grid-cols-2 gap-4">
        {% for i in range(1, 11) %}
            <button id="workspace-{{ i }}"
                    class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded m-2"
                    onclick="switchWorkspace({{ i }})">
                Workspace {{ i }}
            </button>
        {% endfor %}
    </div>
    {# Add functionality to take screenshot #}
    <div class="mt-4">
        <button id="screenshot-button" class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded"
                onclick="window.location.href='/screenshot/take'">
            Take Screenshot
        </button>
    </div>
</div>
<div id="screenshot-result" class="mt-4"></div>
<script defer src="../static/main.js"></script>

</body>
</html>
