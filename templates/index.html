<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Hyprland Remote Control</title>

    <!-- Tailwind -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <style>
        /* =========================================================
           WIRED SOUNDS FOR WIRED PEOPLE – MOBILE OPTIMIZED
           ========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --black: #050505;
            --panel: #0b0b0b;
            --panel-light: #101010;

            --red: #ce7688;
            --red-dark: #61333e;
            --red-deep: #3b2027;

            --cream: #c1b48e;
            --muted: #665e4d;

            --line: #24191c;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.5rem;
            background:
                radial-gradient(
                    circle at 50% 45%,
                    rgba(206, 118, 136, 0.035),
                    transparent 55%
                ),
                var(--black);
            color: var(--cream);
            font-family: 'Courier New', Courier, monospace;
            overflow-x: hidden;
        }

        .wired-card {
            width: 100%;
            max-width: 820px;
            position: relative;
            padding: 1.2rem 0.8rem;
            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.015),
                    transparent 45%
                ),
                var(--panel);
            border: 1px solid var(--red-dark);
            border-radius: 0;
            box-shadow:
                0 0 0 1px rgba(206, 118, 136, 0.025),
                0 20px 80px rgba(0, 0, 0, 0.8);
            background-image:
                repeating-linear-gradient(
                    0deg,
                    rgba(255, 255, 255, 0.012) 0px,
                    rgba(255, 255, 255, 0.012) 1px,
                    transparent 1px,
                    transparent 4px
                ),
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.015),
                    transparent 45%
                );
            background-color: var(--panel);
            overflow: hidden;
        }

        .wired-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--red), transparent);
            opacity: 0.8;
            pointer-events: none;
        }

        .wired-card::after {
            content: "";
            position: absolute;
            top: 8px;
            right: 8px;
            width: 35px;
            height: 35px;
            border-top: 1px solid var(--red-dark);
            border-right: 1px solid var(--red-dark);
            pointer-events: none;
        }

        .title {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
            color: var(--red);
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            font-weight: 400;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            text-shadow: 0 0 12px rgba(206, 118, 136, 0.12);
        }

        .title::before {
            content: "[";
            color: var(--muted);
        }

        .title::after {
            content: "]";
            color: var(--muted);
        }

        .title i {
            color: var(--red);
            font-size: 0.8rem;
            filter: drop-shadow(0 0 6px rgba(206, 118, 136, 0.25));
        }

        .title .cursor-blink {
            display: inline-block;
            width: 5px;
            height: 14px;
            margin-left: 0.1rem;
            background: var(--red);
            animation: blink 1.1s step-end infinite;
        }

        @keyframes blink {
            0%, 45% { opacity: 1; }
            46%, 100% { opacity: 0; }
        }

        /* ========== TABS ========== */
        .tabs {
            display: flex;
            border-bottom: 1px solid var(--line);
            margin-bottom: 0.8rem;
        }
        .tab-btn {
            background: transparent;
            border: none;
            color: var(--muted);
            padding: 0.4rem 0.6rem;
            font-family: 'Courier New', monospace;
            font-size: 0.6rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.15s ease;
            border-bottom: 2px solid transparent;
            flex: 1;
            text-align: center;
        }
        .tab-btn:hover {
            color: var(--cream);
        }
        .tab-btn.active {
            color: var(--red);
            border-bottom-color: var(--red);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }

        /* ========== WORKSPACE GRID ========== */
        .workspace-grid {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 0.4rem;
            margin-top: 0.3rem;
        }

        .workspace-btn {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 56px;
            padding: 0.4rem 0.1rem;
            background: #080808;
            color: #4c3d40;
            border: 1px solid var(--line);
            border-radius: 0;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            transition:
                background 0.15s ease,
                border-color 0.15s ease,
                color 0.15s ease,
                transform 0.15s ease,
                box-shadow 0.15s ease;
        }

        .workspace-btn::before {
            content: "";
            position: absolute;
            top: 4px;
            left: 4px;
            width: 3px;
            height: 3px;
            background: #281c1f;
            transition: background 0.15s ease, box-shadow 0.15s ease;
        }

        .workspace-btn .num {
            font-size: 1.1rem;
            line-height: 1;
            font-weight: 400;
            color: inherit;
        }

        .workspace-btn .label {
            margin-top: 0.1rem;
            color: var(--muted);
            font-size: 0.35rem;
            letter-spacing: 0.15em;
            opacity: 0.7;
        }

        .workspace-btn:hover {
            background: #0e0a0b;
            border-color: var(--red-dark);
            color: var(--red);
            transform: translateY(-1px);
            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.45),
                inset 0 0 20px rgba(206, 118, 136, 0.025);
        }

        .workspace-btn:hover::before {
            background: var(--red);
        }

        .workspace-btn.active-workspace {
            background: #0e0a0b;
            border-color: var(--red);
            color: var(--red);
            box-shadow: 0 0 25px rgba(206, 118, 136, 0.06);
        }
        .workspace-btn.active-workspace::before {
            background: var(--red);
            box-shadow: 0 0 8px var(--red);
        }

        .workspace-btn.focused-workspace {
            background: #0e0a0b;
            border-color: #ce7688;
            color: #ce7688;
            box-shadow: 0 0 30px rgba(206, 118, 136, 0.15);
        }
        .workspace-btn.focused-workspace::before {
            background: #ce7688;
            box-shadow: 0 0 12px #ce7688;
        }

        .workspace-btn.click-flash {
            animation: click-flash 0.6s ease forwards !important;
        }

        @keyframes click-flash {
            0% { transform: scale(1); background: #080808; border-color: var(--line); color: #4c3d40; }
            30% { transform: scale(0.94); background: var(--red-dark); border-color: var(--red); color: var(--red); }
            70% { transform: scale(1.03); background: var(--red-dark); border-color: var(--red); color: var(--red); }
            100% { transform: scale(1); background: #080808; border-color: var(--line); color: #4c3d40; }
        }

        /* ========== MONITORES ========== */
        .monitors-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.4rem 0.8rem;
            margin: 0.4rem 0 0.8rem 0;
            padding: 0.3rem;
            border-top: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
        }

        .monitor-item {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.55rem;
            letter-spacing: 0.05em;
            color: var(--muted);
        }

        .monitor-item .monitor-name {
            color: var(--cream);
            font-weight: 400;
        }

        .monitor-item .monitor-ws {
            background: var(--red-dark);
            color: var(--cream);
            padding: 0.05rem 0.4rem;
            border-radius: 0;
            font-family: 'Courier New', monospace;
            font-size: 0.6rem;
        }

        .monitor-item .monitor-ws.focused {
            background: var(--red);
            color: #050505;
            font-weight: bold;
        }

        /* ========== VOLUME ========== */
        .volume-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            margin: 0.8rem 0;
        }

        .volume-btn {
            background: #080808;
            border: 1px solid var(--line);
            color: var(--muted);
            padding: 0.3rem 0.7rem;
            cursor: pointer;
            transition: 0.15s ease;
            font-size: 0.8rem;
        }
        .volume-btn:hover {
            border-color: var(--red);
            color: var(--red);
            background: rgba(206,118,136,0.035);
        }
        #volume-display {
            min-width: 3rem;
            text-align: center;
            font-size: 0.7rem;
            color: var(--muted);
        }

        /* ========== MÍDIA ========== */
        .media-container {
            margin: 0.3rem 0 0.8rem 0;
            padding: 0.3rem 0;
        }

        .media-player {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .media-art {
            width: 140px;
            height: 140px;
            background: #080808;
            border: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }
        .media-art img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .media-art .placeholder {
            color: var(--muted);
            font-size: 0.6rem;
            text-align: center;
            padding: 0.3rem;
        }

        .media-info {
            text-align: center;
            width: 100%;
        }
        .media-title {
            font-size: 0.9rem;
            color: var(--cream);
            font-weight: 400;
            letter-spacing: 0.05em;
        }
        .media-artist {
            font-size: 0.7rem;
            color: var(--muted);
        }
        .media-status-badge {
            font-size: 0.55rem;
            color: var(--red);
            text-transform: uppercase;
        }

        .media-controls {
            display: flex;
            gap: 0.6rem;
            justify-content: center;
            margin-top: 0.2rem;
        }
        .media-btn {
            background: #080808;
            border: 1px solid var(--line);
            color: var(--muted);
            padding: 0.4rem 0.8rem;
            cursor: pointer;
            transition: 0.15s ease;
            font-size: 0.9rem;
        }
        .media-btn:hover {
            border-color: var(--red);
            color: var(--red);
        }

        /* ========== SCREENSHOT & LOCK ========== */
        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.6rem;
            margin-top: 0.8rem;
        }
        #screenshot-button,
        #lock-button {
            position: relative;
            display: inline-flex !important;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            padding: 0.4rem 1rem !important;
            background: transparent !important;
            color: var(--red) !important;
            border: 1px solid var(--red-dark) !important;
            border-radius: 0 !important;
            font-family: 'Courier New', Courier, monospace !important;
            font-size: 0.6rem !important;
            font-weight: 400 !important;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            transition:
                background 0.15s ease,
                border-color 0.15s ease,
                box-shadow 0.15s ease,
                transform 0.15s ease;
        }

        #screenshot-button::before,
        #lock-button::before {
            content: ">";
            color: var(--muted);
        }

        #screenshot-button:hover,
        #lock-button:hover {
            background: rgba(206, 118, 136, 0.035) !important;
            border-color: var(--red) !important;
            box-shadow: 0 0 25px rgba(206, 118, 136, 0.08);
            transform: translateY(-1px);
        }

        #screenshot-button i,
        #lock-button i {
            font-size: 0.6rem;
        }

        #screenshot-result {
            min-height: 1rem;
            margin-top: 0.4rem;
            color: var(--muted);
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.5rem;
            text-align: center;
            letter-spacing: 0.08em;
        }

        /* ========== SISTEMA ========== */
        .sys-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.6rem;
        }
        .sys-card {
            background: #0b0b0b;
            padding: 0.6rem;
            border: 1px solid var(--line);
        }
        .sys-card .label {
            display: flex;
            justify-content: space-between;
            font-size: 0.6rem;
            color: var(--muted);
        }
        .sys-bar {
            width: 100%;
            background: #1a1a1a;
            height: 4px;
            margin-top: 4px;
            border-radius: 2px;
            overflow: hidden;
        }
        .sys-bar .fill {
            height: 100%;
            background: var(--red);
            transition: width 0.3s;
        }
        .sys-process-list {
            max-height: 120px;
            overflow-y: auto;
            font-size: 0.55rem;
        }
        .sys-process-list::-webkit-scrollbar {
            width: 3px;
        }
        .sys-process-list::-webkit-scrollbar-thumb {
            background: var(--red-dark);
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 480px) {
            .workspace-grid {
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: 0.3rem;
            }
            .workspace-btn {
                min-height: 48px;
                padding: 0.3rem 0.1rem;
            }
            .workspace-btn .num {
                font-size: 0.9rem;
            }
            .workspace-btn .label {
                font-size: 0.3rem;
            }
            .media-art {
                width: 100px;
                height: 100px;
            }
            .media-title {
                font-size: 0.75rem;
            }
            .media-artist {
                font-size: 0.6rem;
            }
            .volume-controls {
                gap: 0.3rem;
            }
            .volume-btn {
                font-size: 0.7rem;
                padding: 0.2rem 0.5rem;
            }
            #volume-display {
                font-size: 0.6rem;
                min-width: 2.5rem;
            }
            .tab-btn {
                font-size: 0.5rem;
                padding: 0.3rem 0.2rem;
            }
            .title {
                font-size: 0.75rem;
                gap: 0.3rem;
            }
            .title .cursor-blink {
                height: 12px;
                width: 4px;
            }
            #screenshot-button, #lock-button {
                font-size: 0.5rem !important;
                padding: 0.3rem 0.8rem !important;
            }
            .wired-card {
                padding: 0.8rem 0.5rem;
            }
            .sys-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 360px) {
            .workspace-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
            .monitors-container {
                flex-direction: column;
                align-items: center;
                gap: 0.2rem;
            }
            .media-art {
                width: 80px;
                height: 80px;
            }
            .media-controls .media-btn {
                font-size: 0.7rem;
                padding: 0.3rem 0.6rem;
            }
        }

        ::-webkit-scrollbar {
            width: 3px;
        }
        ::-webkit-scrollbar-track {
            background: var(--black);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--red-dark);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--red);
        }
    </style>
</head>

<body>

    <div class="wired-card">

        <!-- TÍTULO -->
        <div class="title">
            <i class="fas fa-terminal"></i>
            HYPRLAND-REMOTE
            <span class="cursor-blink"></span>
        </div>

        <!-- TABS -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="tab1">Workspaces</button>
            <button class="tab-btn" data-tab="tab2">Mídia & Volume</button>
            <button class="tab-btn" data-tab="tab3">Sistema</button>
        </div>

        <!-- ============================================================ -->
        <!-- ABA 1: WORKSPACES + LOCK -->
        <!-- ============================================================ -->
        <div id="tab1" class="tab-content active">

            <!-- MONITORES -->
            <div id="monitors-container" class="monitors-container">
                <!-- Preenchido pelo JS -->
            </div>

            <!-- WORKSPACES -->
            <div class="workspace-grid">
                {% for i in range(1, 11) %}
                    <button
                        id="workspace-{{ i }}"
                        class="workspace-btn"
                        onclick="switchWorkspace({{ i }})"
                    >
                        <span class="num">{{ i }}</span>
                        <span class="label">WS</span>
                    </button>
                {% endfor %}
            </div>

            <!-- LOCK -->
            <div class="action-buttons" style="margin-top: 0.8rem;">
                <button id="lock-button" onclick="lockScreen()">
                    <i class="fas fa-lock"></i> LOCK
                </button>
            </div>

        </div>

        <!-- ============================================================ -->
        <!-- ABA 2: MÍDIA + VOLUME + SCREENSHOT -->
        <!-- ============================================================ -->
        <div id="tab2" class="tab-content">

            <!-- MÍDIA -->
            <div class="media-container">
                <div id="media-player" class="media-player">
                    <!-- Arte -->
                    <div class="media-art" id="media-art">
                        <div class="placeholder">no cover</div>
                    </div>
                    <!-- Informações -->
                    <div class="media-info">
                        <div class="media-title" id="media-title">Nenhuma mídia</div>
                        <div class="media-artist" id="media-artist">-</div>
                        <div class="media-status-badge" id="media-status">⏹ parado</div>
                    </div>
                    <!-- Controles -->
                    <div class="media-controls">
                        <button class="media-btn" onclick="mediaControl('previous')" title="Anterior">
                            <i class="fas fa-backward"></i>
                        </button>
                        <button class="media-btn" id="media-play-btn" onclick="mediaControl('play-pause')" title="Play/Pause">
                            <i class="fas fa-play"></i>
                        </button>
                        <button class="media-btn" onclick="mediaControl('next')" title="Próxima">
                            <i class="fas fa-forward"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- VOLUME -->
            <div class="volume-controls">
                <button class="volume-btn" onclick="adjustVolume('down')">
                    <i class="fas fa-volume-down"></i>
                </button>
                <span id="volume-display">--%</span>
                <button class="volume-btn" onclick="adjustVolume('up')">
                    <i class="fas fa-volume-up"></i>
                </button>
                <button class="volume-btn" id="vol-mute-btn" onclick="toggleMute()">
                    <i class="fas fa-volume-mute"></i>
                </button>
            </div>

            <!-- SCREENSHOT -->
            <div class="action-buttons" style="margin-top: 0.8rem;">
                <button id="screenshot-button" onclick="window.location.href='/screenshot/take'">
                    <i class="fas fa-camera"></i> SCREENSHOT
                </button>
            </div>

        </div>

        <!-- ============================================================ -->
        <!-- ABA 3: SISTEMA (btop-style) -->
        <!-- ============================================================ -->
        <div id="tab3" class="tab-content">
            <div class="sys-grid">
                <!-- CPU -->
                <div class="sys-card">
                    <div class="label">
                        <span>CPU</span>
                        <span id="sys-cpu-pct">--%</span>
                    </div>
                    <div class="sys-bar">
                        <div id="sys-cpu-bar" class="fill" style="width:0%"></div>
                    </div>
                    <div class="flex justify-between text-[0.5rem] text-zinc-500 mt-1">
                        <span id="sys-cpu-temp">--°C</span>
                        <span id="sys-cpu-freq">-- GHz</span>
                    </div>
                </div>

                <!-- RAM -->
                <div class="sys-card">
                    <div class="label">
                        <span>RAM</span>
                        <span id="sys-ram-pct">--%</span>
                    </div>
                    <div class="sys-bar">
                        <div id="sys-ram-bar" class="fill" style="width:0%"></div>
                    </div>
                    <div class="flex justify-between text-[0.5rem] text-zinc-500 mt-1">
                        <span id="sys-ram-used">-- / -- GB</span>
                    </div>
                </div>

                <!-- GPU -->
                <div class="sys-card col-span-2" id="gpu-container">
                    <div class="label">
                        <span>GPU</span>
                        <span id="sys-gpu-pct">--%</span>
                    </div>
                    <div class="sys-bar">
                        <div id="sys-gpu-bar" class="fill" style="width:0%"></div>
                    </div>
                    <div class="flex justify-between text-[0.5rem] text-zinc-500 mt-1">
                        <span id="sys-gpu-vram">VRAM -- / -- MB</span>
                        <span id="sys-gpu-temp">--°C</span>
                    </div>
                </div>

                <!-- Processos -->
                <div class="sys-card col-span-2">
                    <div class="text-[0.55rem] text-zinc-500 mb-1">Processos (top por memória)</div>
                    <div id="sys-process-list" class="sys-process-list"></div>
                </div>
            </div>
        </div>

        <!-- RESULTADO (feedback) -->
        <div id="screenshot-result"></div>
    </div>

    <script>
        // ================================================================
        // TABS
        // ================================================================
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                this.classList.add('active');
                const tabId = this.dataset.tab;
                document.getElementById(tabId).classList.add('active');
            });
        });

        // ================================================================
        // FUNÇÕES DE WORKSPACE E MONITORES
        // ================================================================

        function highlightWorkspaceButtons(monitors) {
            document.querySelectorAll(".workspace-btn").forEach((btn) => {
                btn.classList.remove("active-workspace", "focused-workspace");
            });

            monitors.forEach((mon) => {
                const wsId = mon.workspace;
                if (wsId !== undefined && wsId !== null) {
                    const btn = document.getElementById(`workspace-${wsId}`);
                    if (btn) {
                        btn.classList.add("active-workspace");
                        if (mon.focused) {
                            btn.classList.add("focused-workspace");
                        }
                    }
                }
            });
        }

        function updateMonitorsUI(monitors) {
            const container = document.getElementById("monitors-container");
            if (!container) return;

            if (!monitors || monitors.length === 0) {
                container.innerHTML =
                    '<span class="text-muted" style="font-size:0.7rem;">no monitors found</span>';
                return;
            }

            let html = "";
            monitors.forEach((mon) => {
                const ws = mon.workspace !== undefined ? mon.workspace : "?";
                const focusedClass = mon.focused ? "focused" : "";
                html += `
                    <div class="monitor-item">
                        <span class="monitor-name">${mon.name}</span>
                        <span class="monitor-ws ${focusedClass}">${ws}</span>
                        ${
                    mon.focused
                        ? '<i class="fas fa-circle" style="color:var(--red);font-size:0.4rem;margin-left:0.2rem;"></i>'
                        : ""
                }
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function fetchMonitors() {
            fetch("/monitors")
                .then((res) => res.json())
                .then((data) => {
                    if (Array.isArray(data)) {
                        updateMonitorsUI(data);
                        highlightWorkspaceButtons(data);
                    } else {
                        console.error("Unexpected monitors data:", data);
                    }
                })
                .catch((err) => console.error("Error fetching monitors:", err));
        }

        function switchWorkspace(workspaceId) {
            const btn = document.getElementById(`workspace-${workspaceId}`);
            if (btn) {
                btn.classList.add("click-flash");
                setTimeout(() => btn.classList.remove("click-flash"), 700);
            }

            fetch("/workspace/switch", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ workspace: workspaceId }),
            })
                .then((response) => {
                    if (!response.ok) throw new Error("Network response was not ok");
                    return response.json();
                })
                .then((data) => {
                    console.log("Success:", data);
                    fetchMonitors();
                    getVolume();
                    fetchMedia();
                })
                .catch((err) => console.error("Error switching workspace:", err));
        }

        // ================================================================
        // FUNÇÕES DE VOLUME
        // ================================================================

        function getVolume() {
            fetch("/volume")
                .then((response) => response.json())
                .then((data) => {
                    const display = document.getElementById("volume-display");
                    if (data.volume !== undefined) {
                        display.textContent = data.muted ? "MUTED" : data.volume + "%";
                        const muteIcon = document.querySelector("#vol-mute-btn i");
                        if (data.muted) {
                            muteIcon.className = "fas fa-volume-off";
                        } else {
                            muteIcon.className = "fas fa-volume-mute";
                        }
                    }
                })
                .catch((err) => console.error("Erro ao obter volume:", err));
        }

        function adjustVolume(action) {
            fetch("/volume/control", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ action: action }),
            })
                .then((response) => response.json())
                .then((data) => {
                    if (data.volume !== undefined) {
                        const display = document.getElementById("volume-display");
                        display.textContent = data.muted ? "MUTED" : data.volume + "%";
                    }
                })
                .catch((err) => console.error("Erro ao ajustar volume:", err));
        }

        function toggleMute() {
            fetch("/volume/control", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ action: "toggle-mute" }),
            })
                .then((response) => response.json())
                .then((data) => {
                    if (data.volume !== undefined) {
                        const display = document.getElementById("volume-display");
                        display.textContent = data.muted ? "MUTED" : data.volume + "%";
                        const muteIcon = document.querySelector("#vol-mute-btn i");
                        if (data.muted) {
                            muteIcon.className = "fas fa-volume-off";
                        } else {
                            muteIcon.className = "fas fa-volume-mute";
                        }
                    }
                })
                .catch((err) => console.error("Erro ao mutar/desmutar:", err));
        }

        // ================================================================
        // FUNÇÕES DE MÍDIA (playerctl)
        // ================================================================

        function fetchMedia() {
            fetch("/media")
                .then((res) => {
                    if (!res.ok) throw new Error("Erro ao buscar mídia");
                    return res.json();
                })
                .then((data) => {
                    updateMediaUI(data);
                })
                .catch((err) => {
                    console.error("Erro ao buscar mídia:", err);
                    updateMediaUI({
                        title: "Nenhuma mídia",
                        artist: "-",
                        status: "Stopped",
                        art_url: "",
                    });
                });
        }

        function updateMediaUI(data) {
            const titleEl = document.getElementById("media-title");
            const artistEl = document.getElementById("media-artist");
            const statusEl = document.getElementById("media-status");
            const artEl = document.getElementById("media-art");
            const playBtn = document.getElementById("media-play-btn");

            titleEl.textContent = data.title || "Nenhuma mídia";
            artistEl.textContent = data.artist || "-";

            let statusText = "⏹ parado";
            if (data.status === "Playing") statusText = "▶ tocando";
            else if (data.status === "Paused") statusText = "⏸ pausado";
            statusEl.textContent = statusText;

            if (data.status === "Playing") {
                playBtn.innerHTML = '<i class="fas fa-pause"></i>';
            } else {
                playBtn.innerHTML = '<i class="fas fa-play"></i>';
            }

            if (data.art_url && data.art_url.length > 0) {
                artEl.innerHTML = `<img src="${data.art_url}" alt="capa" onerror="this.parentElement.innerHTML='<div class=\\'placeholder\\'>no cover</div>'" />`;
            } else {
                artEl.innerHTML = `<div class="placeholder">no cover</div>`;
            }
        }

        function mediaControl(action) {
            fetch("/media/control", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ action: action }),
            })
                .then((res) => res.json())
                .then((data) => {
                    updateMediaUI(data);
                })
                .catch((err) => {
                    console.error("Erro no controle de mídia:", err);
                });
        }

        // ================================================================
        // LOCK SCREEN
        // ================================================================

        function lockScreen() {
            fetch("/lock", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
            })
                .then((response) => {
                    if (!response.ok) throw new Error("Network response was not ok");
                    return response.json();
                })
                .then((data) => {
                    console.log("Lock screen:", data.message);
                    document.getElementById("screenshot-result").textContent =
                        "🔒 Screen locked!";
                    setTimeout(() => {
                        document.getElementById("screenshot-result").textContent = "";
                    }, 3000);
                })
                .catch((err) => {
                    console.error("Error locking screen:", err);
                    document.getElementById("screenshot-result").textContent =
                        "❌ Error locking screen";
                });
        }

        // ================================================================
        // FUNÇÕES DE SISTEMA
        // ================================================================

        let sysInterval = null;

        function fetchSystemStats() {
            fetch("/system/stats")
                .then((res) => res.json())
                .then((data) => {
                    if (data.error) {
                        document.getElementById("sys-cpu-pct").textContent = "--%";
                        document.getElementById("sys-ram-pct").textContent = "--%";
                        return;
                    }
                    // CPU
                    document.getElementById("sys-cpu-pct").textContent = data.cpu.percent + "%";
                    document.getElementById("sys-cpu-bar").style.width = data.cpu.percent + "%";
                    document.getElementById("sys-cpu-temp").textContent =
                        data.cpu.temp !== null ? data.cpu.temp + "°C" : "--°C";
                    document.getElementById("sys-cpu-freq").textContent =
                        data.cpu.freq !== null ? data.cpu.freq + " GHz" : "-- GHz";

                    // RAM
                    document.getElementById("sys-ram-pct").textContent = data.ram.percent + "%";
                    document.getElementById("sys-ram-bar").style.width = data.ram.percent + "%";
                    document.getElementById("sys-ram-used").textContent =
                        data.ram.used + " / " + data.ram.total + " GB";

                    // GPU
                    const gpuContainer = document.getElementById("gpu-container");
                    if (data.gpu) {
                        gpuContainer.style.display = "block";
                        document.getElementById("sys-gpu-pct").textContent = data.gpu.util + "%";
                        document.getElementById("sys-gpu-bar").style.width = data.gpu.util + "%";
                        document.getElementById("sys-gpu-vram").textContent =
                            "VRAM " + data.gpu.vram_used + " / " + data.gpu.vram_total + " MB";
                        document.getElementById("sys-gpu-temp").textContent = data.gpu.temp + "°C";
                    } else {
                        gpuContainer.style.display = "none";
                    }

                    // Processos
                    const list = document.getElementById("sys-process-list");
                    if (data.processes && data.processes.length) {
                        list.innerHTML = data.processes
                            .map(
                                (p) =>
                                    `<div class="flex justify-between border-b border-zinc-800 py-0.5">
                                <span class="truncate max-w-[60%]">${p.name}</span>
                                <span>${p.mem}% mem · ${p.cpu}% cpu</span>
                            </div>`
                            )
                            .join("");
                    } else {
                        list.innerHTML = '<span class="text-zinc-600">Nenhum processo</span>';
                    }
                })
                .catch((err) => {
                    console.error("Erro ao buscar stats:", err);
                });
        }

        // ================================================================
        // INICIALIZAÇÃO
        // ================================================================

        function init() {
            fetchMonitors();
            getVolume();
            fetchMedia();
            fetchSystemStats();
            if (sysInterval) clearInterval(sysInterval);
            sysInterval = setInterval(fetchSystemStats, 2000);
        }

        document.addEventListener("DOMContentLoaded", init);
        window.addEventListener("focus", init);

        setInterval(() => {
            fetchMonitors();
            getVolume();
            fetchMedia();
        }, 5000);
    </script>

</body>
</html>
